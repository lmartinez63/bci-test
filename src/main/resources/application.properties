spring.application.name=user-registration-api

# H2
spring.datasource.url=jdbc:h2:mem:bcidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:bci-nisum-challenge-secret-key-change-me-0123456789}
jwt.expiration-ms=86400000

# Password (BCRYPT | SHA512 = PBKDF2WithHmacSHA512)
password.algorithm=BCRYPT
password.iterations=210000
password.salt-length=16

# Validation
validation.email-regex=^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$
validation.password-regex=^(?=.*[A-Z])(?=.*[0-9])(?=.*[@#$%^&+=]).{8,}$

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.root=INFO
logging.level.com.nisum.bci=INFO
logging.pattern.level=%5p [requestId=%X{requestId:-}]
logging.file.name=logs/user-registration-api.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
