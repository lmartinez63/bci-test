spring.datasource.url=jdbc:h2:mem:bcidb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=test-secret-key-for-unit-and-integration-tests-0123456789
jwt.expiration-ms=86400000

password.algorithm=BCRYPT
password.iterations=210000
password.salt-length=16

validation.email-regex=^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$
validation.password-regex=^(?=.*[A-Z])(?=.*[0-9])(?=.*[@#$%^&+=]).{8,}$

logging.level.com.nisum.bci=DEBUG
logging.pattern.level=%5p [requestId=%X{requestId:-}]
